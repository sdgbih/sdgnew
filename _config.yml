# Jekyll configuration for Open SDG platform
remote_theme: open-sdg/open-sdg@2.4.0

title: general.site_title
url: ""
environment: staging

languages:
  - en
  - bs
  - sr
  - hr

collections:
  pages:
    output: true
    permalink: /:path/
  posts:
    output: true
    permalink: /news/:year/:month/:day/:title.html
  indicators:
    output: true
  goals:
    output: true

plugins:
  - jekyll-remote-theme
  - jekyll-open-sdg-plugins

exclude:
  - vendor
  - scripts
  - remotedata
  - Gemfile
  - Gemfile.lock
  - README
  - README.md
  - LICENSE

# REGISTRACIJA POLJA (Ovo ih "otključava" na stranici)
indicator_metadata:
  - name: national_indicator_definition
    label: global_indicators.definition-label
    translation_key: global_indicators.national_indicator_definition
    scope: national
  - name: national_rationale
    label: global_indicators.intention-label
    translation_key: global_indicators.national_rationale
    scope: national
  - name: national_methodology_characteristics
    label: global_indicators.methodology-label
    translation_key: global_indicators.national_methodology_characteristics
    scope: national
  - name: national_long_objective
    label: global_indicators.long_term_objective-label
    translation_key: global_indicators.national_long_objective
    scope: national  
  # EU metapodaci tab (scope: global) — ista sadržaj kao national, ali odvojeno editabilno
  - name: eu_indicator_definition
    label: global_indicators.definition-label
    translation_key: global_indicators.eu_indicator_definition
    scope: global
  - name: eu_rationale
    label: global_indicators.rationale-label
    translation_key: global_indicators.eu_rationale
    scope: global
  - name: eu_methodology_characteristics
    label: global_indicators.methodology-label
    translation_key: global_indicators.eu_methodology_characteristics
    scope: global
  - name: eu_long_objective
    label: global_indicators.long_term_objective-label
    translation_key: global_indicators.eu_long_objective
    scope: global  
  # Back-up varijante za svaki slučaj
  - name: national_indicator_definition
    label: global_indicators.description-label
    scope: national
  - name: national_indicator_rationale
    label: global_indicators.intention-label
    scope: national
# Osnovne postavke za vidljivost
hide_empty_metadata: true
remote_data_prefix: https://sdgbih.github.io/sdgnewdata/
repository_url_data: https://github.com/sdgbih/sdgnewdata/
        
accessible_tabs: true
accessible_charts: true
series_toggle: true

data_fields:
  series: SERIES
  units: UNIT_MEASURE

