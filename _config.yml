# Jekyll configuration for Open SDG platform

# Tell the Remote Theme plugin to use the Open SDG platform (Jekyll theme).
remote_theme: open-sdg/open-sdg@2.4.0

# Replace this title as needed.
title: general.site_title
url: ""
environment: staging

languages:
  - en
  - bs
  - sr
  - hr

# Pages
collections:
  pages:
    output: true
    permalink: /:path/
  posts:
    output: true
    permalink: /news/:year/:month/:day/:title.html
  indicators:
    output: true
  goals:
    output: true

# Tell Jekyll to use the Remote Theme plugin.
plugins:
  - jekyll-remote-theme
  - jekyll-open-sdg-plugins

# Exclude some files/folders.
exclude:
  - vendor
  - scripts
  - remotedata
  - Gemfile
  - Gemfile.lock
  - README
  - README.md
  - LICENSE

# --- METADATA CONFIGURATION ---
# Ovdje definišemo koja polja iz meta/1-1-1.yml fajla će biti vidljiva na sajtu
indicator_metadata:
  - name: indicator_definition
    label: global_indicators.description-label
  - name: goal_meta_link_text
    label: global_indicators.intention-label
  - name: methodology_characteristics
    label: global_indicators.methodology-label

# --- PROSE CONFIGURATION (Opcionalno, ali preporučeno za CMS) ---
prose:
  metadata:
    indicators:
      - name: indicator_definition
        field:
          element: textarea
          label: Description
      - name: goal_meta_link_text
        field:
          element: textarea
          label: Intention
      - name: methodology_characteristics
        field:
          element: textarea
          label: Methodology
